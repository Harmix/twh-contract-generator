<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TWH — рабочее пространство сделки</title>
<script src="../jszip.min.js"></script>
<script src="../rules.js"></script>
<script src="../engine.js"></script>
<script src="../docx.js"></script>
<script src="../deal-engine.js"></script>
<script src="../rfq-engine.js"></script>
<style>
  :root{--bg:#f6f5f3;--panel:#fff;--ink:#1a1a1a;--muted:#6b6b6b;--line:#e2e0dc;
    --accent:#1f4f3f;--acc-bg:#e9f1ed;--buyer:#2a4d7a;--buyer-bg:#eaf0f8;--warn:#8a5a00;--warn-bg:#fdf6e6;--bad:#9b2c2c}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  header{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);padding:10px 18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  header h1{font-size:15px;margin:0;font-weight:600}
  .ref{color:var(--muted);font-size:12.5px}
  .sp{flex:1}
  .roles{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .roles button{border:0;border-radius:0;padding:7px 14px;background:#fff}
  .roles button.on.supplier{background:var(--accent);color:#fff}
  .roles button.on.buyer{background:var(--buyer);color:#fff}
  button{font:inherit;padding:6px 12px;border-radius:7px;border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--ink)}
  button:hover{border-color:#c9c6c0}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  body.as-buyer button.primary{background:var(--buyer);border-color:var(--buyer)}
  button.link{border:0;background:none;color:var(--accent);padding:2px 4px;text-decoration:underline}
  main{max-width:1180px;margin:0 auto;padding:16px 18px 60px}
  .turn{border-radius:11px;padding:12px 14px;margin-bottom:14px;background:var(--acc-bg);border:1px solid #cfe0d9}
  body.as-buyer .turn{background:var(--buyer-bg);border-color:#d3e0ef}
  .turn h2{font-size:12px;letter-spacing:.06em;text-transform:uppercase;margin:0 0 8px;color:var(--muted)}
  .turn .acts{display:flex;flex-direction:column;gap:7px}
  .act{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .act input{width:220px}
  .wait{color:var(--muted)}
  .stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:14px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  .stat .k{font-size:12px;color:var(--muted)} .stat .v{font-size:17px;font-weight:600;margin-top:2px}
  nav.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
  nav.tabs button{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;padding:8px 12px;color:var(--muted)}
  nav.tabs button.on{border-bottom-color:var(--ink);color:var(--ink);font-weight:600}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:16px;margin-bottom:14px}
  .panel h3{margin:0 0 10px;font-size:15px}
  table.t{border-collapse:collapse;width:100%;font-size:13.5px}
  table.t th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;border-bottom:1px solid var(--line);padding:6px 8px}
  table.t td{border-bottom:1px solid #efeeea;padding:7px 8px;vertical-align:top}
  .pill{display:inline-block;font-size:12px;padding:2px 8px;border-radius:20px;background:#efeeea;color:#444;white-space:nowrap}
  .pill.good{background:#e3f1e8;color:#1f5d3a}.pill.mid{background:var(--warn-bg);color:var(--warn)}.pill.blue{background:var(--buyer-bg);color:var(--buyer)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .kv div{margin:3px 0}.kv .k{color:var(--muted)}
  label{font-size:12.5px;color:var(--muted);display:block}
  input,select{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px;width:100%;margin-top:2px;background:#fff}
  .items td input{margin:0}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
  .row>label{flex:1;min-width:150px}
  .note{font-size:12.5px;color:var(--muted)}
  .timeline{list-style:none;margin:0;padding:0}
  .timeline li{padding:8px 0;border-bottom:1px solid #efeeea;display:grid;grid-template-columns:130px 110px 1fr;gap:10px;font-size:13.5px}
  .who-supplier{color:var(--accent);font-weight:600}.who-buyer{color:var(--buyer);font-weight:600}.who-system{color:var(--muted)}
  #toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#2b2b2b;color:#fff;padding:10px 16px;border-radius:9px;max-width:680px;font-size:13.5px;display:none;z-index:50}
  #toast.bad{background:var(--bad)}
  dialog{border:0;border-radius:12px;padding:0;max-width:900px;width:92vw}
  dialog .dh{display:flex;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff}
  .doc{padding:26px 32px;font-family:Georgia,"Times New Roman",serif;font-size:13.5px;line-height:1.55;max-height:75vh;overflow:auto}
  .doc h2{text-align:center;font-size:16px;margin:0 0 4px}.doc h3{font-size:13.5px;margin:18px 0 6px}
  .doc p{margin:0 0 8px;text-align:justify}.doc .en{color:#7a7a7a;font-style:italic;font-size:12.5px;margin-top:-4px}
  .doc table{border-collapse:collapse;width:100%;margin:6px 0 12px;font-size:12.5px}.doc td{border:1px solid #cfcdc8;padding:4px 7px;vertical-align:top}
  .doc hr{border:0;border-top:1px dashed #cfcdc8;margin:20px 0}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:13px;display:flex;flex-direction:column;gap:6px}
  .card.sel{border-color:var(--buyer);box-shadow:0 0 0 2px #d3e0ef}
  .card h4{margin:0;font-size:14.5px}.card .price{font-size:16px;font-weight:600}
  .chips{display:flex;flex-wrap:wrap;gap:4px}.chips .pill{font-size:11.5px}
  .checks{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;margin:6px 0}
  .checks label{display:flex;gap:6px;align-items:flex-start;color:var(--ink);font-size:13px}.checks input{width:auto;margin-top:3px}
  .src{font-size:11.5px;color:var(--buyer);background:var(--buyer-bg);border-radius:4px;padding:1px 6px;white-space:nowrap}
  .offer{border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:10px}
  .muted-tab{opacity:.45}
  @media (max-width:860px){.stats{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.timeline li{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>TWH · Trading Ways Hub</h1>
  <span class="ref" id="dealref"></span>
  <span class="sp"></span>
  <span class="note">Вы действуете как</span>
  <div class="roles" id="roles">
    <button data-role="supplier" class="supplier">Поставщик</button>
    <button data-role="buyer" class="buyer">Покупатель</button>
  </div>
  <button id="reset" title="Начать демо заново">Сбросить демо</button>
</header>

<main>
  <section class="turn" id="turn"></section>
  <section class="stats" id="stats"></section>
  <nav class="tabs" id="tabs">
    <button data-tab="catalog">Каталог</button>
    <button data-tab="rfq">Запросы (RFQ)</button>
    <button data-tab="contract" data-deal="1">Договор</button>
    <button data-tab="specs" data-deal="1">Спецификации</button>
    <button data-tab="payments" data-deal="1">Счета и оплата</button>
    <button data-tab="transport" data-deal="1">Транспорт</button>
    <button data-tab="timeline">Хронология</button>
  </nav>
  <section id="view"></section>
  <p class="note">Прототип v0.3 по архитектуре TWH v0.1. TWH не принимает и не хранит деньги: платёж здесь — цифровой двойник внешнего банковского перевода. Данные хранятся только в этом браузере. <a href="../">Генератор договора</a></p>
</main>

<dialog id="dlg"><div class="dh"><b id="dlgTitle"></b><span class="sp"></span><button id="dlgDocx" class="primary">Скачать DOCX</button><button id="dlgClose">Закрыть</button></div><div class="doc" id="dlgBody"></div></dialog>
<div id="toast"></div>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const esc = t => String(t == null ? '' : t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const money = (v, c) => (Number(v)||0).toLocaleString('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' ' + (c||'');
  const num = v => (Number(v)||0).toLocaleString('ru-RU');
  const KEY = 'twh-workspace-v3';
  const today = () => new Date().toISOString().slice(0,10);
  const plusDays = d => new Date(Date.now()+d*864e5).toISOString().slice(0,10);

  const SEED = {
    companies: {
      supplier: { name: 'ТОО «Кондитерский дом Алатау»', country: 'Казахстан', reg: 'БИН 041240004821',
        rep: 'Ахметов А.К., директор', basis: 'Устава', address: 'г. Алматы, ул. Розыбакиева 247',
        bank: 'АО «Halyk Bank»', iban: 'KZ123456789012345678', swift: 'HSBKKZKX' },
      buyer: { name: 'ООО «Торговый дом Восток»', country: 'Узбекистан', reg: 'ИНН 302456789',
        rep: 'Каримов Ш.Р., генеральный директор', basis: 'Устава', address: 'г. Ташкент, ул. Амира Темура 15',
        bank: 'АКБ «Ипотека-банк»', iban: 'UZ987654321098765432', swift: 'IPTBUZ22' }
    },
    catalog: [
      { name: 'Вафли сахарные «Артек»', description: 'Классические вафли с жировой начинкой, короб 5 кг, 12 коробов на паллете', hs: '1905.32', unit: 'кг', price: 2.35, moq: 2000, packaging: 'Гофротара (картон), 5 кг', shelf_life_months: 9, standard: 'СТ РК 1183-2003', compliance: ['Декларация ЕАЭС', 'Удостоверение качества'] },
      { name: 'Печенье сахарное «Юбилейное»', description: 'Сахарное печенье, короб 4 кг', hs: '1905.31', unit: 'кг', price: 1.90, moq: 1000, packaging: 'Гофротара (картон), 4 кг', shelf_life_months: 6, standard: 'ГОСТ 24901-2014', compliance: ['Декларация ЕАЭС', 'Халал'] },
      { name: 'Пряники «Тульские» с начинкой', description: 'Печатные пряники с повидлом, короб 3 кг', hs: '1905.90.20', unit: 'кг', price: 2.10, moq: 1000, packaging: 'Гофротара (картон), 3 кг', shelf_life_months: 4, standard: 'ГОСТ 15810-2014', compliance: ['Декларация ЕАЭС'] },
      { name: 'Вафельные трубочки со сгущёнкой', description: 'Трубочки в индивидуальной упаковке, короб 2,5 кг', hs: '1905.32', unit: 'кг', price: 3.40, moq: 500, packaging: 'Гофротара (картон), 2,5 кг', shelf_life_months: 6, standard: 'СТ РК 1183-2003', compliance: ['Декларация ЕАЭС', 'Халал', 'ISO 22000'] }
    ]
  };

  const nowIso = () => new Date().toISOString();
  const load = () => { try { const r = localStorage.getItem(KEY); return r ? JSON.parse(r) : null; } catch(e){ return null; } };
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify({ W, role, tab })); } catch(e){} };
  const saved = load();
  let W = saved && saved.W && saved.W.v === 3 ? saved.W : MARKET.createWorkspace(SEED, nowIso());
  let role = (saved && saved.role) || 'buyer';
  let tab = (saved && saved.tab) || 'catalog';
  let basket = {};      // product_id -> {qty, spec}
  const DL = () => W.deal;

  function toast(msg, bad){ const t=$('toast'); t.textContent=msg; t.className=bad?'bad':''; t.style.display='block'; clearTimeout(toast._t); toast._t=setTimeout(()=>t.style.display='none', bad?6500:3200); }
  function run(fn, okMsg){ try { W = fn(W); save(); render(); if (okMsg) toast(okMsg); return true; } catch(e){ if (e instanceof DEAL.DealError){ toast(e.message, true); return false; } throw e; } }
  const deal = (fn, okMsg) => run(w => MARKET.dealCmd(w, fn), okMsg);

  /* ---------- документы ---------- */
  let dlgDoc = null;
  function renderBlocks(blocks){
    return blocks.map(b => {
      if (b.type==='title') return `<h2>${esc(b.ru)}</h2><p class="en" style="text-align:center">${esc(b.en)}</p>`;
      if (b.type==='h') return `<h3>${esc(b.ru)} <span style="font-weight:400;color:#8a8a8a">/ ${esc(b.en)}</span></h3>`;
      if (b.type==='p') return `<p>${esc(b.ru)}</p><p class="en">${esc(b.en)}</p>`;
      if (b.type==='table') return '<table>'+b.rows.map(r=>'<tr>'+r.map(c=>`<td>${esc(c)}</td>`).join('')+'</tr>').join('')+'</table>';
      if (b.type==='pagebreak') return '<hr>';
      return '';
    }).join('');
  }
  function openDoc(title, blocks, filename){ dlgDoc = { blocks, filename }; $('dlgTitle').textContent = title; $('dlgBody').innerHTML = renderBlocks(blocks); $('dlg').showModal(); }
  $('dlgClose').onclick = () => $('dlg').close();
  $('dlgDocx').onclick = async () => {
    if (typeof JSZip === 'undefined') return toast('jszip.min.js не найден рядом с приложением', true);
    try { await DOCX.download(dlgDoc.blocks, true, dlgDoc.filename); } catch(e){ toast('Не удалось собрать DOCX: '+e.message, true); }
  };
  const docContract = () => openDoc('Договор '+DL().contract.number, ENGINE.buildContract(DEAL.contractFields(DL())).blocks, DL().contract.number+'.docx');
  const docSpec = id => { const sp=DL().specs.find(x=>x.id===id); openDoc('Спецификация №'+sp.number, DEAL.specBlocks(DL(),id), `${DL().contract.number}_Spec-${sp.number}.docx`); };
  const docInv = id => { const i=DL().invoices.find(x=>x.id===id); openDoc('Счёт '+i.number, DEAL.invoiceBlocks(DL(),id), i.number+'.docx'); };
  const docCmr = id => { const c=DL().cmrs.find(x=>x.id===id); openDoc(c.number, DEAL.cmrBlocks(DL(),id), c.number+'.docx'); };

  /* ---------- «Ваш ход» ---------- */
  function renderTurn(){
    const acts = MARKET.nextActions(W, role);
    let html = `<h2>Ваш ход · ${esc(DEAL.ACTORS[role])}</h2><div class="acts">`;
    if (!acts.length) html += `<div class="wait">Сейчас от вас ничего не требуется. Переключитесь на другую сторону.</div>`;
    acts.forEach((a,i) => {
      if (a.kind==='wait') html += `<div class="wait">${esc(a.text)}</div>`;
      else if (a.kind==='goto_catalog') html += `<div class="act"><span>${esc(a.text)}</span><button class="primary" data-goto="catalog">Открыть каталог</button></div>`;
      else if (a.kind==='answer_rfq') html += `<div class="act"><span>${esc(a.text)}</span><button class="primary" data-goto="rfq">Открыть запрос</button></div>`;
      else if (a.kind==='review_offer') html += `<div class="act"><span>${esc(a.text)}</span><button class="primary" data-goto="rfq">Сравнить и решить</button></div>`;
      else if (a.kind==='pay') html += `<div class="act"><span>${esc(a.text)}</span><input id="ref_${i}" placeholder="Референс SWIFT / п/п"><button class="primary" data-act="pay" data-id="${a.id}" data-i="${i}">Отметить оплату</button></div>`;
      else if (a.kind==='ship') html += `<div class="act"><span>${esc(a.text)}</span><input id="veh_${i}" placeholder="Госномер тягача / прицепа"><button class="primary" data-act="ship" data-id="${a.id}" data-i="${i}">Выписать CMR</button></div>`;
      else html += `<div class="act"><span>${esc(a.text)}</span><button class="primary" data-act="${a.kind}" data-id="${a.id||''}">Сделать</button></div>`;
    });
    $('turn').innerHTML = html + '</div>';
  }

  function renderStats(){
    if (!DL()) {
      const r = W.rfqs[W.rfqs.length-1];
      $('stats').innerHTML = [['Товаров в каталоге', W.catalog.length], ['Запросов (RFQ)', W.rfqs.length], ['Предложений', W.offers.length],
        ['Статус запроса', r ? MARKET.RFQ_STATUS_RU[r.status] : 'нет'], ['Сделка', 'после принятия предложения']]
        .map(([k,v])=>`<div class="stat"><div class="k">${k}</div><div class="v" style="font-size:15px">${esc(v)}</div></div>`).join('');
      return;
    }
    const s = DEAL.summary(DL()), c = DL().deal.currency;
    $('stats').innerHTML = [['Сумма договора', money(s.limit,c)], ['Законтрактовано', money(s.used,c)], ['Оплачено и сверено', money(s.paid,c)], ['Ожидает оплаты', money(s.awaiting,c)], ['На эскроу', money(s.escrow,c)]]
      .map(([k,v])=>`<div class="stat"><div class="k">${k}</div><div class="v">${v}</div></div>`).join('');
  }

  const pill = (text, kind) => `<span class="pill ${kind||''}">${esc(text)}</span>`;
  const specPill = st => pill(DEAL.SPEC_STATUS_RU[st], st==='FULFILLED'?'good':(st==='IN_REVIEW'?'mid':'blue'));
  const payPill = st => pill(DEAL.PAYMENT_STATUS_RU[st], st==='RECONCILED'?'good':(['AWAITING_PAYMENT','PAID_UNCONFIRMED'].includes(st)?'mid':(st==='HELD_IN_ESCROW'?'blue':'')));
  const approvals = obj => ['supplier','buyer'].map(r => `${DEAL.ACTORS[r]}: ${obj.approvals[r]===obj.version?'✓ согласовал':'— ждём'}`).join(' · ');
  const opts = (list, cur) => list.map(([v,t])=>`<option value="${esc(v)}" ${v===cur?'selected':''}>${esc(t)}</option>`).join('');
  const noDeal = () => `<div class="panel note">Сделка появится, когда покупатель примет предложение поставщика по RFQ. Тогда договор, спецификация, счета и CMR соберутся из уже введённых данных.</div>`;

  /* ---------- каталог ---------- */
  function vCatalog(){
    const openRfq = W.rfqs.some(r => ['SENT','OFFERED'].includes(r.status));
    const cards = W.catalog.map(p => {
      const b = basket[p.id];
      const buyerBox = role==='buyer' && !W.deal && !openRfq ? `<div class="row"><label>Количество, ${esc(p.unit)} (мин. ${num(p.moq)})<input type="number" data-qty="${p.id}" value="${b?b.qty:''}" placeholder="0"></label></div>
        <label>Требования к товару (Specification)<input data-specfor="${p.id}" value="${esc(b?b.spec:'')}" placeholder="напр. влажность ≤ 4,5%"></label>` : '';
      return `<div class="card ${b && b.qty>0 ? 'sel':''}"><div class="note">${esc(p.sku)} · ТН ВЭД ${esc(p.hs)}</div><h4>${esc(p.name)}</h4>
        <div class="note">${esc(p.description)}</div>
        <div class="price">${money(p.price, p.currency)} / ${esc(p.unit)}</div>
        <div class="note">Мин. партия ${num(p.moq)} ${esc(p.unit)} · срок годности ${p.shelf_life_months||'—'} мес. · ${esc(p.standard)}</div>
        <div class="note">Происхождение: ${esc(p.origin)} · ${esc(p.packaging)}</div>
        <div class="chips">${p.compliance.map(c=>pill(c)).join('')}</div>${buyerBox}</div>`;
    }).join('');
    let form = '';
    if (role==='buyer' && !W.deal && !openRfq) form = rfqForm();
    else if (role==='buyer' && openRfq) form = `<div class="panel note">RFQ уже отправлен поставщику. Статус — на вкладке «Запросы (RFQ)».</div>`;
    let supForm = '';
    if (role==='supplier') supForm = `<div class="panel"><h3>Опубликовать товар</h3><div class="row">
      <label>Наименование<input id="p_name" placeholder="Печенье овсяное"></label><label>ТН ВЭД<input id="p_hs" value="1905.31"></label>
      <label>Цена, USD<input id="p_price" type="number" step="0.01" value="1.75"></label><label>Ед.<input id="p_unit" value="кг"></label>
      <label>Мин. партия<input id="p_moq" type="number" value="1000"></label><label>Срок годности, мес.<input id="p_shelf" type="number" value="6"></label>
      <button id="p_add">Опубликовать</button></div></div>`;
    return `<div class="panel"><h3>Каталог поставщика · ${esc(W.companies.supplier.name)}</h3>
      <p class="note">${role==='buyer'?'Укажите количество у нужных товаров, ниже заполните условия и отправьте RFQ.':'Так ваши товары видят покупатели.'}</p>
      <div class="cards">${cards}</div></div>${form}${supForm}`;
  }

  function rfqForm(){
    const chosen = W.catalog.filter(p => basket[p.id] && basket[p.id].qty > 0);
    const route = (window.__rf && window.__rf.route) || 'UZ', inc = (window.__rf && window.__rf.inc) || 'DAP';
    const docs = MARKET.defaultDocuments(W, route, inc);
    const total = chosen.reduce((a,p)=>a+p.price*basket[p.id].qty,0);
    return `<div class="panel"><h3>Новый запрос предложения (RFQ)</h3>
      ${chosen.length ? `<table class="t"><tr><th>Product</th><th>Quantity</th><th>Specification</th><th>Origin</th><th>По прайсу</th></tr>${chosen.map(p=>`<tr><td>${esc(p.name)}</td><td>${num(basket[p.id].qty)} ${esc(p.unit)}</td><td>${esc(basket[p.id].spec||'—')}</td><td>${esc(p.origin)}</td><td>${money(p.price*basket[p.id].qty,p.currency)}</td></tr>`).join('')}
        <tr><td colspan="4" style="text-align:right"><b>Ориентир по прайсу</b></td><td><b>${money(total,'USD')}</b></td></tr></table>` : '<p class="note">Пока не выбран ни один товар: укажите количество в карточках выше.</p>'}
      <div class="row" style="margin-top:10px">
        <label>Destination (страна)<select id="r_route">${opts(Object.entries(RULES.routes).map(([k,r])=>[k,r.name_ru]), route)}</select></label>
        <label>Место поставки<input id="r_place" value="г. Ташкент, ул. Амира Темура 15, склад Покупателя"></label>
        <label>Incoterm<select id="r_inc">${opts(Object.keys(RULES.incoterms).filter(k=>RULES.incoterms[k].road_ok).map(k=>[k,k]), inc)}</select></label>
      </div><div class="row">
        <label>Currency<select id="r_cur">${opts([['USD','USD'],['EUR','EUR'],['KZT','KZT'],['RUB','RUB']],'USD')}</select></label>
        <label>Payment Terms<select id="r_pay">${opts(RULES.payment_presets.map(p=>[p.id,p.label]),'30_70')}</select></label>
        <label>Delivery Terms: поставка до<input id="r_del" type="date" value="${plusDays(30)}"></label>
        <label>Offer Deadline<input id="r_dead" type="date" value="${plusDays(3)}"></label>
      </div>
      <div style="margin-top:8px"><b style="font-size:13px">Compliance Attributes</b><div class="checks">${MARKET.COMPLIANCE.map(c=>`<label><input type="checkbox" data-comp="${c.id}" ${['eaeu_decl','shelf_75'].includes(c.id)?'checked':''}>${esc(c.ru)}</label>`).join('')}</div></div>
      <div class="note" id="r_docs"><b>Documents</b> (по правилам маршрута, уйдут в договор и спецификацию): ${esc(docs.join('; '))}</div>
      <p><button class="primary" id="r_send">Отправить RFQ поставщику</button></p></div>`;
  }

  /* ---------- запросы и предложения ---------- */
  function vRfq(){
    if (!W.rfqs.length) return `<div class="panel note">Запросов пока нет. Покупатель создаёт RFQ из каталога.</div>`;
    return W.rfqs.slice().reverse().map(r => {
      const offers = W.offers.filter(o => o.rfq_id === r.id);
      const live = offers.find(o => o.status === 'SUBMITTED');
      const comp = r.compliance.map(c => (MARKET.COMPLIANCE.find(x=>x.id===c)||{ru:c}).ru);
      const fields = [['Product / Quantity / Specification', r.items.map(i=>`${i.name} — ${num(i.qty)} ${i.unit}${i.specification?' ('+i.specification+')':''}`).join('; ')],
        ['Origin', r.origin], ['Destination', `${r.destination_country}, ${r.delivery_place}`], ['Incoterm', r.incoterms], ['Currency', r.currency],
        ['Payment Terms', (RULES.payment_presets.find(p=>p.id===r.payment_preset)||{}).label], ['Delivery Terms', `автотранспорт, поставка до ${r.delivery_date}`],
        ['Documents', r.documents.join('; ')], ['Compliance Attributes', comp.join('; ')||'—'], ['Offer Deadline', r.offer_deadline]];
      let action = '';
      if (role==='supplier' && r.status==='SENT') {
        action = `<div class="offer"><b>Ваше предложение</b><table class="t"><tr><th>Товар</th><th>Кол-во</th><th>Прайс</th><th>Ваша цена</th></tr>${r.items.map((i,k)=>`<tr><td>${esc(i.name)}</td><td>${num(i.qty)} ${esc(i.unit)}</td><td>${money(i.list_price,r.currency)}</td><td style="width:140px"><input type="number" step="0.01" id="o_p${k}" value="${i.list_price}"></td></tr>`).join('')}</table>
          <div class="row" style="margin-top:8px"><label>Срок отгрузки, дней<input id="o_lead" type="number" value="14"></label><label>Предложение действует до<input id="o_valid" type="date" value="${plusDays(7)}"></label>
          <label>Комментарий<input id="o_note" placeholder="напр. цена с учётом паллетирования"></label>
          <button class="primary" data-offer="${r.id}">Отправить предложение</button></div>
          <div class="row" style="margin-top:8px"><label>Причина отказа<input id="o_reason" placeholder="напр. нет мощностей в ноябре"></label><button data-decline="${r.id}">Отклонить запрос</button></div></div>`;
      }
      const offerCards = offers.slice().reverse().map(o => {
        const listTotal = r.items.reduce((a,i)=>a+i.list_price*i.qty,0);
        const diff = o.total - listTotal;
        return `<div class="offer"><b>${esc(o.ref)}</b> ${pill(MARKET.OFFER_STATUS_RU[o.status], o.status==='ACCEPTED'?'good':(o.status==='SUBMITTED'?'mid':''))}
          <table class="t" style="margin-top:6px"><tr><th>Товар</th><th>Кол-во</th><th>Цена</th><th>Сумма</th></tr>${r.items.map((i,k)=>`<tr><td>${esc(i.name)}</td><td>${num(i.qty)} ${esc(i.unit)}</td><td>${money(o.prices[k],r.currency)}</td><td>${money(o.prices[k]*i.qty,r.currency)}</td></tr>`).join('')}
          <tr><td colspan="3" style="text-align:right"><b>Итого</b></td><td><b>${money(o.total,r.currency)}</b></td></tr></table>
          <div class="note">${diff<0?`Ниже прайса на ${money(-diff,r.currency)}`:(diff>0?`Выше прайса на ${money(diff,r.currency)}`:'По прайсу')} · отгрузка за ${o.lead_time_days} дн., до ${esc(o.ship_by)} · ${o.meets_delivery?'успевает к сроку':'<b>позже запрошенного срока</b>'} · действует до ${esc(o.valid_until)}${o.note?' · '+esc(o.note):''}</div>
          ${role==='buyer' && o.status==='SUBMITTED' ? `<p><button class="primary" data-accept="${o.id}">Принять и создать сделку</button> <button data-reject="${o.id}">Отклонить</button></p>`:''}</div>`;
      }).join('');
      return `<div class="panel"><h3>${esc(r.ref)} ${pill(MARKET.RFQ_STATUS_RU[r.status], r.status==='ACCEPTED'?'good':(['SENT','OFFERED'].includes(r.status)?'mid':''))}</h3>
        <table class="t">${fields.map(([k,v])=>`<tr><td style="width:230px" class="note">${esc(k)}</td><td>${esc(v)}</td></tr>`).join('')}</table>
        ${r.decline_reason?`<p class="note">Причина отказа: ${esc(r.decline_reason)}</p>`:''}
        ${role==='buyer' && ['SENT','OFFERED'].includes(r.status)?`<p><button data-close="${r.id}">Закрыть запрос</button></p>`:''}
        ${action}${offerCards}</div>`;
    }).join('');
  }

  /* ---------- сделка ---------- */
  function specsTable(){
    const d = DL();
    if (!d.specs.length) return `<p class="note">Спецификация №1 появится автоматически из принятого предложения, как только обе стороны согласуют договор.</p>`;
    return `<table class="t"><tr><th>№</th><th>Дата</th><th>Позиций</th><th>Сумма</th><th>Поставка до</th><th>Статус</th><th></th></tr>` +
      d.specs.map(sp => `<tr><td>${sp.number}</td><td>${esc(sp.date)}</td><td>${sp.items.length}</td><td>${money(DEAL.specTotal(sp), d.deal.currency)}</td><td>${esc(sp.delivery_date)}</td><td>${specPill(sp.status)}</td><td><button class="link" data-doc="spec" data-id="${sp.id}">документ</button></td></tr>`).join('') + '</table>';
  }
  function vContract(){
    if (!DL()) return noDeal();
    const d = DL(), src = MARKET.contractSources(W);
    return `<div class="panel">
      <h3>Договор ${esc(d.contract.number)}, версия ${d.contract.version}</h3>
      <p>${pill(DEAL.CONTRACT_STATUS_RU[d.contract.status], d.contract.status==='AGREED'?'good':'mid')} <span class="note">${approvals(d.contract)}</span></p>
      <p><button class="primary" data-doc="contract">Открыть договор</button></p></div>
      ${src.length?`<div class="panel"><h3>Откуда взялись данные договора</h3><p class="note">Ничего не вводилось заново: всё пришло из каталога, RFQ, предложения и профилей компаний.</p>
      <table class="t"><tr><th>Поле</th><th>Значение</th><th>Источник</th></tr>${src.map(([k,v,s])=>`<tr><td class="note">${esc(k)}</td><td>${esc(v)}</td><td><span class="src">${esc(s)}</span></td></tr>`).join('')}</table></div>`:''}`;
  }
  function vSpecs(){
    if (!DL()) return noDeal();
    return `<div class="panel"><h3>Спецификации к договору</h3>${specsTable()}</div>`;
  }
  function vPayments(){
    if (!DL()) return noDeal();
    const d = DL();
    if (!d.payments.length) return '<div class="panel note">Платежи появятся после согласования договора: график строится из условий оплаты RFQ.</div>';
    const c = d.deal.currency;
    const rows = d.payments.map(p => { const sp = d.specs.find(x=>x.id===p.spec_id), inv = d.invoices.find(x=>x.id===p.invoice_id);
      return `<tr><td>${esc(p.ref)}</td><td>№${sp.number}</td><td>${esc(p.purpose_ru)}<div class="note">${p.method==='ESCROW'?'Эскроу TWH, раскрытие после получения товара':(p.method==='LC'?'Аккредитив':'Банковский перевод')}</div></td>
        <td>${money(p.amount,c)}</td><td>${esc(p.due_at||'—')}</td><td>${payPill(p.status)}${p.bank_reference?`<div class="note">реф. ${esc(p.bank_reference)}</div>`:''}</td>
        <td>${inv?`<button class="link" data-doc="inv" data-id="${inv.id}">${esc(inv.number)}</button>`:'<span class="note">счёт после события</span>'}</td></tr>`; }).join('');
    return `<div class="panel"><h3>Платежи · цифровой двойник</h3><p class="note">Перевод идёт между банковскими счетами сторон. TWH хранит обязательство, статус, референс и сверку со счётом.</p>
      <table class="t"><tr><th>Платёж</th><th>Спец.</th><th>Назначение</th><th>Сумма</th><th>Срок</th><th>Статус</th><th>Счёт</th></tr>${rows}</table></div>`;
  }
  function vTransport(){
    if (!DL()) return noDeal();
    const d = DL();
    const blocked = d.specs.filter(sp=>sp.status==='AGREED').map(sp=>({ sp, b: DEAL.shipmentBlockers(d, sp.id) })).filter(x=>x.b.length);
    const rows = d.cmrs.map(c => { const sp=d.specs.find(x=>x.id===c.spec_id);
      return `<tr><td>${esc(c.number)}</td><td>№${sp.number}</td><td>${esc(c.vehicle)}</td><td>${esc(c.place_delivery)}</td><td>${pill(DEAL.CMR_STATUS_RU[c.status], c.status==='DELIVERED'?'good':'blue')}</td><td><button class="link" data-doc="cmr" data-id="${c.id}">открыть</button></td></tr>`; }).join('');
    return `<div class="panel"><h3>CMR</h3>${d.cmrs.length?`<table class="t"><tr><th>Номер</th><th>Спец.</th><th>Машина</th><th>Место разгрузки</th><th>Статус</th><th></th></tr>${rows}</table>`:'<p class="note">CMR ещё не выписывались. Отгрузку открывает поставщик, когда аванс получен.</p>'}</div>
      ${blocked.length?`<div class="panel"><h3>Почему отгрузка пока закрыта</h3>${blocked.map(x=>`<p>Спецификация №${x.sp.number}: ${esc(x.b.join(' '))}</p>`).join('')}</div>`:''}`;
  }
  function vTimeline(){
    const items = MARKET.timeline(W).slice().reverse().map(e => `<li><span class="note">${esc(new Date(e.at).toLocaleString('ru-RU'))}</span><span class="who-${e.actor}">${esc(DEAL.ACTORS[e.actor]||'Система')}</span><span>${esc(e.text)}</span></li>`).join('');
    return `<div class="panel"><h3>Хронология: от каталога до исполнения</h3><ul class="timeline">${items}</ul></div>`;
  }

  /* ---------- рендер ---------- */
  function render(){
    document.body.className = role==='buyer' ? 'as-buyer' : '';
    $('dealref').textContent = DL() ? `${DL().deal.ref} · договор ${DL().contract.number}` : (W.rfqs.length ? W.rfqs[W.rfqs.length-1].ref : 'каталог');
    document.querySelectorAll('#roles button').forEach(b => b.classList.toggle('on', b.dataset.role===role));
    document.querySelectorAll('#tabs button').forEach(b => { b.classList.toggle('on', b.dataset.tab===tab); b.classList.toggle('muted-tab', !!b.dataset.deal && !DL()); });
    renderTurn(); renderStats();
    $('view').innerHTML = ({catalog:vCatalog, rfq:vRfq, contract:vContract, specs:vSpecs, payments:vPayments, transport:vTransport, timeline:vTimeline}[tab])();
  }

  /* ---------- события ---------- */
  $('roles').onclick = e => { const r=e.target.dataset.role; if(r){ role=r; save(); render(); } };
  $('tabs').onclick = e => { const t=e.target.dataset.tab; if(t){ tab=t; save(); render(); } };
  $('reset').onclick = () => { if (confirm('Сбросить демо и начать заново с каталога?')) { W = MARKET.createWorkspace(SEED, nowIso()); role='buyer'; tab='catalog'; basket={}; window.__rf=null; save(); render(); toast('Демо сброшено'); } };

  document.body.addEventListener('click', e => {
    const t = e.target, now = nowIso();
    if (t.dataset.goto) { tab = t.dataset.goto; save(); render(); return; }
    if (t.dataset.doc){ ({contract:docContract, spec:()=>docSpec(t.dataset.id), inv:()=>docInv(t.dataset.id), cmr:()=>docCmr(t.dataset.id)})[t.dataset.doc](); return; }
    if (t.id==='p_add') run(w => MARKET.addProduct(w, role, { name:$('p_name').value, hs:$('p_hs').value, price:$('p_price').value, unit:$('p_unit').value, moq:$('p_moq').value, shelf_life_months:$('p_shelf').value, compliance:['Декларация ЕАЭС'] }, now), 'Товар опубликован в каталоге');
    if (t.id==='r_send') {
      const items = Object.entries(basket).filter(([,b])=>b.qty>0).map(([id,b])=>({ product_id:id, qty:b.qty, specification:b.spec }));
      const compliance = [...document.querySelectorAll('[data-comp]')].filter(x=>x.checked).map(x=>x.dataset.comp);
      if (run(w => MARKET.createRFQ(w, role, { items, route:$('r_route').value, delivery_place:$('r_place').value, incoterms:$('r_inc').value, currency:$('r_cur').value, payment_preset:$('r_pay').value, delivery_date:$('r_del').value, offer_deadline:$('r_dead').value, compliance }, now), 'RFQ отправлен поставщику')) { basket={}; tab='rfq'; save(); render(); }
    }
    if (t.dataset.offer) { const r = W.rfqs.find(x=>x.id===t.dataset.offer); const prices = r.items.map((_,k)=>Number($('o_p'+k).value));
      run(w => MARKET.submitOffer(w, role, r.id, { prices, lead_time_days:$('o_lead').value, valid_until:$('o_valid').value, note:$('o_note').value }, now), 'Предложение отправлено покупателю'); }
    if (t.dataset.decline) run(w => MARKET.declineRFQ(w, role, t.dataset.decline, $('o_reason').value, now), 'Запрос отклонён');
    if (t.dataset.close) run(w => MARKET.closeRFQ(w, role, t.dataset.close, now), 'Запрос закрыт');
    if (t.dataset.reject) run(w => MARKET.rejectOffer(w, role, t.dataset.reject, now), 'Предложение отклонено, запрос снова открыт');
    if (t.dataset.accept) { if (run(w => MARKET.acceptOffer(w, role, t.dataset.accept, now), 'Сделка создана: договор собран из RFQ и предложения')) { tab='contract'; save(); render(); } }
    const a = t.dataset.act, id = t.dataset.id;
    if (a==='approve_contract') run(w => MARKET.approveContract(w, role, now), 'Договор согласован с вашей стороны');
    if (a==='approve_spec') deal(s=>DEAL.approveSpec(s, role, id, now), 'Спецификация согласована');
    if (a==='pay') { const ref=$('ref_'+t.dataset.i).value; deal(s=>DEAL.markPaymentSent(s, role, id, { bank_reference: ref }, now), 'Оплата отмечена. Поставщик увидит её у себя.'); }
    if (a==='confirm_payment') deal(s=>DEAL.confirmPayment(s, role, id, now), 'Поступление подтверждено и сверено со счётом');
    if (a==='ship') { const v=$('veh_'+t.dataset.i).value; deal(s=>DEAL.issueCMR(s, role, id, { vehicle: v }, now), 'CMR выписана, груз в пути'); }
    if (a==='deliver') deal(s=>DEAL.confirmDelivery(s, role, id, now), 'Получение подтверждено');
  });
  document.body.addEventListener('change', e => {
    const t = e.target;
    if (t.dataset.qty) { const b = basket[t.dataset.qty] || (basket[t.dataset.qty] = { qty:0, spec:'' }); b.qty = Number(t.value)||0; render(); }
    if (t.dataset.specfor) { const b = basket[t.dataset.specfor] || (basket[t.dataset.specfor] = { qty:0, spec:'' }); b.spec = t.value; }
    if (t.id==='r_route' || t.id==='r_inc') { window.__rf = { route:$('r_route').value, inc:$('r_inc').value }; $('r_docs').innerHTML = '<b>Documents</b> (по правилам маршрута, уйдут в договор и спецификацию): ' + esc(MARKET.defaultDocuments(W, window.__rf.route, window.__rf.inc).join('; ')); }
  });

  render();
})();
</script>
</body>
</html>
